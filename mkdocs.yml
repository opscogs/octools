site_name: octools
site_url: https://octools.docs.opscogs.com
docs_dir: ./docs/site
repo_url: https://github.com/opscogs/octools
repo_name: opscogs/octools

nav:
  - index.md
  - octools_descriptor.md
  - octools_converters.md
  - octools_listing.md
  - octools_typescript.md
  # Generated by TypeDoc before the build (gitignored); see the CI docs steps.
  - TypeScript API: api/typescript/index.html

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: sh
          class: bash
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - awesome-pages

extra_css:
  - assets/brand-theme.css

theme:
  name: material
  logo: assets/img/opscogs-logo-lockup-color-light.svg
  favicon: assets/img/favicon.png
  font:
    text: Source Sans 3
    code: Roboto Mono
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.tracking
  palette:
    # Palette toggle for light mode (default)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to auto mode

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
