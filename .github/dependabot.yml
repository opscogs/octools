version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint and TypeDoc support TypeScript up to 6.0.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types track the oldest supported Node (engines.node), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
